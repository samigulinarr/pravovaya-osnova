<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРАВОВАЯ ОСНОВА – Юридическое партнерство в Дзержинске</title>
    <style>
        :root {
            --primary-color: #5c3a21;
            --accent-color: #d4a373;
            --bg-color: #fcfbfa;
            --text-color: #2c2c2c;
            --white: #ffffff;
            --gray-light: #f3f0ec;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--gray-light);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .company-name h1 {
            font-size: 1.25rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .company-name p {
            font-size: 0.85rem;
            color: #666;
        }

        .contacts {
            text-align: right;
        }

        .contacts a {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 3px;
            transition: color 0.2s;
        }

        .contacts a:hover {
            color: var(--accent-color);
        }

        .contacts .email {
            font-size: 0.95rem;
            color: #555;
            font-weight: normal;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .map-container {
            width: 100%;
            height: 450px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--gray-light);
        }

        /* Плавающая кнопка MAX в правом нижнем углу */
        .max-float-btn {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 9999;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            padding: 14px 22px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .max-float-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
        }

        .max-float-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid var(--gray-light);
            background: var(--white);
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
            }
            .contacts {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="Логотип Правовая Основа">
            <div class="company-name">
                <h1>Правовая Основа</h1>
                <p>Юридическое партнерство</p>
            </div>
        </div>
        <div class="contacts">
            <a href="tel:+78313250426">+7 (8313) 25-04-26</a>
            <a href="tel:+79307002123">+7 (930) 700-21-23</a>
            <a href="mailto:250426@list.ru" class="email">250426@list.ru</a>
        </div>
    </header>

    <main>
        <section>
            <h2>Мы на карте</h2>
            <div class="map-container">
                <script type="text/javascript" charset="utf-8" async src="https://api-maps.yandex.ru/services/constructor/1.0/js/?um=constructor%3A7a14f3b733737b51cb59da5f2d774fca75f048d08aa39eb75e252200f68d6010&amp;width=100%25&amp;height=450&amp;lang=ru_RU&amp;scroll=true"></script>
            </div>
        </section>
    </main>

    <!-- Плавающая кнопка MAX в правом нижнем углу -->
    <a href="https://max.ru/" target="_blank" rel="noopener noreferrer" class="max-float-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-3H8v-2h3V8.5L15.5 12 11 15.5z"/></svg>
        Написать в MAX
    </a>

    <footer>
        &copy; Правовая основа. Юридическое партнерство.
    ></footer>

</body>
</html>
